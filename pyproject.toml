[project]
name = "ods-recsys-competition"
version = "0.1.0"
description = "Project for recsys competition"
authors = [
    { name = "Misha Dolgushev", email = "maikldolgushev@yandex.ru" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.3.3,<3.0.0",
    "more-itertools>=10.8.0,<11.0.0",
    "matplotlib>=3.10.8,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "hydra-core>=1.3.2,<2.0.0",
    "rectools[torch] (>=0.17.0,<0.18.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "clearml (>=2.1.3,<3.0.0)",
    "litlogger (>=0.1.7,<0.2.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# rectools с extras torch (CPU не будет заменять GPU-версию, так как torch уже установлен)
rectools = { version = "0.17.0", extras = ["torch"] }

# dev dependencies
[tool.poetry.group.dev.dependencies]
ipykernel = ">=7.1.0,<8.0.0"
black = "24.10.0"
isort = "5.13.2"
pylint = "3.1.0"
mypy = "1.13.0"
flake8 = "7.0.0"
bandit = "1.7.8"
pytest = "8.3.3"
radon = "6.0.1"
coverage = "7.5.0"
autopep8 = "2.1.0"
codespell = "2.2.6"
pytest-subtests = "0.12.1"
flake8-docstrings = "1.7.0"
pep8-naming = "0.13.3"
pytest-cov = "5.0.0"
pytest-mock = "3.14.0"
click = "8.1.7"
gitpython = "3.1.43"

[tool.poetry.group.docs]
optional = true
[tool.poetry.group.docs.dependencies]
sphinx = "5.1.1"
nbsphinx = "0.8.9"
sphinx-rtd-theme = "1.0.0"

[tool.black]
line-length = 120
target-version = ["py310"]
