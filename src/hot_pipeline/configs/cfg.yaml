defaults:
  - model: sasrec
  - splitter: time_splitter
  - metrics: metrics
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled
  - _self_
  
hydra:  
  output_subdir: null  
  run:  
    dir: .

user_features:
  - age
  - income
  - sex
  - kids_flg

item_features:
  - genres
  - countries
  - age_rating
  - directors
  - release_year_cat

TOP_N: 10

logging:
  project_name: ods_recsys_competition
  task_name: fit_sasrec
  tags: [
    "sasrec",
    "hot"
  ]